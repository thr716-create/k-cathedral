
name: Extract K-Cathedral ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -name 'k-cathedral-metaverse-*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP" -d extracted

          ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
          cp -a "$ROOT"/. .
          rm -rf extracted "$ZIP"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract K-Cathedral project"
          git push
