services:
  - type: web
    name: k-cathedral
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: k-cathedral-data
      mountPath: /var/data
      sizeGB: 1
